<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <h1>{{TITLE}}</h1>
      <h2>Authentification requise</h2>
      {{NOTICE}}
      <form method="post" action="/login">
        <label for="password">Mot de passe</label>
        <div class="field">
          <input id="password" name="password" type="password" autocomplete="off" required>
          <button type="button" id="togglePassword">Afficher</button>
        </div>
        <p class="inline-help">Le mot de passe Web est defini dans la configuration ESP32.</p>
        <div class="btn-row">
          <button class="primary" type="submit">Valider</button>
        </div>
      </form>
    </div>
  </div>
  <script>
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    if (passwordInput && togglePassword) {
      togglePassword.addEventListener('click', () => {
        const isHidden = passwordInput.type === 'password';
        passwordInput.type = isHidden ? 'text' : 'password';
        togglePassword.textContent = isHidden ? 'Masquer' : 'Afficher';
      });
    }
  </script>
</body>
</html>
