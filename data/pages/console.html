<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="{{REFRESH_SECONDS}}; url=/console">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="card">
    <header>
      <h1>{{TITLE}}</h1>
    </header>
    <nav>
      <a class="{{ACTIVE_HOME}}" href="/">Accueil</a>
      <a class="{{ACTIVE_HISTORY}}" href="/history">Historique PWM</a>
      <a class="{{ACTIVE_PROFILE}}" href="/profile">Profil</a>
      <a class="{{ACTIVE_CONSOLE}}" href="/console">Console</a>
    </nav>
    {{NOTICE}}
    <section class="section">
      <form method="post" action="/console/settings" onsubmit="return confirm('Enregistrer les parametres de logs puis redemarrer l\'ESP32-C3 ?');">
        <div class="grid cols-2">
          <div>
            <label for="log_level">Niveau LOG</label>
            <select id="log_level" name="log_level">
              {{LOG_LEVEL_OPTIONS}}
            </select>
          </div>
          <div>
            <label for="refresh_seconds">Refresh Console</label>
            <select id="refresh_seconds" name="refresh_seconds">
              {{REFRESH_OPTIONS}}
            </select>
          </div>
        </div>
        <div class="btn-row">
          <button class="primary" type="submit">Enregistrer + Redemarrer</button>
        </div>
      </form>
    </section>
    <div class="log-box">
      {{LOG_CONTENT}}
    </div>
  </div>
  <script>
    (() => {
      const box = document.querySelector('.log-box');
      const key = 'consoleScroll';
      const nearBottom = (view, total, top) => total - top - view < 24;
      let saved = null;
      try { saved = JSON.parse(sessionStorage.getItem(key)); } catch (e) {}
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      if (box) {
        box.scrollTop = (!saved || saved.boxBottom) ? box.scrollHeight : saved.boxTop;
      }
      if (saved) {
        window.scrollTo(0, saved.pageBottom ? document.documentElement.scrollHeight : saved.pageTop);
      }
      window.addEventListener('pagehide', () => {
        const doc = document.documentElement;
        const state = {
          pageTop: window.scrollY,
          pageBottom: nearBottom(window.innerHeight, doc.scrollHeight, window.scrollY),
          boxTop: box ? box.scrollTop : 0,
          boxBottom: box ? nearBottom(box.clientHeight, box.scrollHeight, box.scrollTop) : true
        };
        try { sessionStorage.setItem(key, JSON.stringify(state)); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
